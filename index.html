<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apostila Python Interativa — Parte I</title>
<style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --panel-2: #eef1f8;
  --border: #dbe0ec;
  --text: #202433;
  --text-dim: #5b6178;
  --accent: #306998;
  --accent-2: #ffd43b;
  --accent-2-text: #4a3b00;
  --ok: #1b8a5a;
  --ok-bg: #e6f6ee;
  --err: #c9333a;
  --err-bg: #fdecec;
  --code-bg: #1e2333;
  --code-text: #e8ebf5;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(20,25,45,0.08), 0 1px 2px rgba(20,25,45,0.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161f;
    --panel: #1c1f2b;
    --panel-2: #232739;
    --border: #323752;
    --text: #e9ebf5;
    --text-dim: #a3a8c2;
    --accent: #6fa8d8;
    --accent-2: #ffd43b;
    --accent-2-text: #3a2e00;
    --ok: #4fd398;
    --ok-bg: #113328;
    --err: #ff8080;
    --err-bg: #3a1a1c;
    --code-bg: #0f1220;
    --code-text: #e8ebf5;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.55;
}
code, pre, .mono {
  font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
}
#app { display: flex; flex-direction: column; min-height: 100vh; }

header.top {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 20;
}
header.top .brand { display: flex; flex-direction: column; flex: 0 0 auto; }
header.top .brand strong { font-size: 15px; }
header.top .brand span { font-size: 12px; color: var(--text-dim); }
#menuBtn {
  display: none;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 16px;
}
.progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
.progress-bar {
  flex: 1;
  height: 8px;
  background: var(--panel-2);
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress-bar > div {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  width: 0%;
  transition: width .3s ease;
}
.progress-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

.layout { flex: 1; display: flex; min-height: 0; }

nav#sidebar {
  width: 300px;
  flex: 0 0 300px;
  border-right: 1px solid var(--border);
  background: var(--panel);
  overflow-y: auto;
  padding: 12px 8px 40px;
}
nav#sidebar .mod {
  margin-bottom: 6px;
  border-radius: 8px;
  overflow: hidden;
}
nav#sidebar .mod-title {
  font-weight: 600;
  font-size: 13px;
  padding: 9px 10px;
  background: var(--panel-2);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 8px;
}
nav#sidebar .mod-screens {
  list-style: none;
  margin: 4px 0 0;
  padding: 0;
}
nav#sidebar .mod-screens li {
  padding: 6px 10px 6px 20px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
nav#sidebar .mod-screens li:hover { background: var(--panel-2); }
nav#sidebar .mod-screens li.active {
  background: var(--accent);
  color: white;
  font-weight: 600;
}
nav#sidebar .mod-screens li .chk {
  width: 14px; flex: 0 0 14px; text-align: center; font-size: 11px; color: var(--ok);
}
nav#sidebar .mod-screens li.active .chk { color: var(--accent-2); }

main#content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px 60px;
  max-width: 880px;
  margin: 0 auto;
  width: 100%;
}
@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  nav#sidebar {
    position: fixed;
    left: 0; top: 53px; bottom: 0;
    z-index: 30;
    transform: translateX(-105%);
    transition: transform .2s ease;
    box-shadow: var(--shadow);
  }
  nav#sidebar.open { transform: translateX(0); }
  main#content { padding: 20px 16px 60px; }
}

.screen-kicker { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.screen-title { font-size: 24px; font-weight: 800; margin: 0 0 18px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card h3 { margin-top: 0; font-size: 15px; }
ul.plain, ol.plain { margin: 8px 0; padding-left: 22px; }
ul.plain li, ol.plain li { margin-bottom: 6px; }

.glossary {
  border-left: 4px solid var(--accent);
  background: var(--panel-2);
  border-radius: 0 8px 8px 0;
  padding: 10px 14px;
  margin: 12px 0;
}
.glossary .term { font-weight: 700; color: var(--accent); }
.glossary .ex { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

pre.diagram {
  background: var(--code-bg);
  color: var(--code-text);
  border-radius: 8px;
  padding: 16px;
  overflow-x: auto;
  font-size: 13.5px;
  white-space: pre;
}
pre.codeblock {
  background: var(--code-bg);
  color: var(--code-text);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  font-size: 13.5px;
  margin: 0;
}

.step-list { margin: 0; padding: 0; list-style: none; }
.step-list li {
  display: none;
  padding: 10px 12px;
  background: var(--panel-2);
  border-radius: 8px;
  margin-bottom: 8px;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 13.5px;
  white-space: pre-wrap;
  border-left: 3px solid var(--accent);
  animation: fadein .25s ease;
}
.step-list li.shown { display: block; }
@keyframes fadein { from { opacity: 0; transform: translateY(-4px);} to { opacity: 1; transform: translateY(0);} }
.btn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.secondary {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn.small { padding: 6px 11px; font-size: 12.5px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

.line-item { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.line-item .lhead {
  padding: 10px 12px;
  background: var(--panel-2);
  cursor: pointer;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 13.5px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.line-item .lbody { display: none; padding: 12px 14px; border-top: 1px solid var(--border); font-size: 14px; }
.line-item.open .lbody { display: block; }
.line-item .arrow { color: var(--text-dim); }

.errbox { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.errbox .ehead {
  background: var(--err-bg);
  color: var(--err);
  padding: 10px 12px;
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}
.errbox .ebody { display: none; padding: 12px 14px; }
.errbox.open .ebody { display: block; }

.code-runner { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 10px 0; }
.code-runner textarea {
  width: 100%;
  min-height: 110px;
  background: var(--code-bg);
  color: var(--code-text);
  border: none;
  padding: 12px 14px;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 13.5px;
  resize: vertical;
  tab-size: 4;
}
.code-runner textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.runner-bar {
  padding: 8px 10px;
  background: var(--panel-2);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.runner-out {
  background: #0c0e17;
  color: #cfe8d6;
  padding: 10px 14px;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: 13px;
  white-space: pre-wrap;
  min-height: 20px;
  border-top: 1px solid var(--border);
}
.runner-out.error { color: #ff9b9b; }
.pyodide-note { font-size: 12px; color: var(--text-dim); }

.exercise { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.exercise .exnum { font-weight: 700; color: var(--accent); margin-right: 6px; }
.exercise textarea.answer {
  width: 100%;
  min-height: 70px;
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-size: 13.5px;
  font-family: inherit;
  margin-top: 8px;
}
.gabarito-box {
  display: none;
  margin-top: 10px;
  background: var(--ok-bg);
  border: 1px dashed var(--ok);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13.5px;
}
.gabarito-box.open { display: block; }
.gabarito-box .tag { color: var(--ok); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }

.checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
.checklist-item:last-child { border-bottom: none; }
.checklist-item input { margin-top: 3px; width: 16px; height: 16px; }
.checklist-item.done label { color: var(--ok); }
.checklist-progress { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }

.quiz-q { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.quiz-q .qtext { font-weight: 600; margin-bottom: 10px; }
.quiz-opt {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text);
}
.quiz-opt:hover { border-color: var(--accent); }
.quiz-opt.correct { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.quiz-opt.wrong { background: var(--err-bg); border-color: var(--err); color: var(--err); font-weight: 600; }
.quiz-opt:disabled { cursor: default; }
.quiz-explain { display: none; font-size: 13px; color: var(--text-dim); margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--border); }
.quiz-explain.open { display: block; }
.quiz-score { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }

table.cmdtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.cmdtable th, table.cmdtable td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
table.cmdtable th { background: var(--panel-2); }
table.cmdtable code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

.qa-item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.qa-item .qhead { padding: 10px 12px; background: var(--panel-2); cursor: pointer; font-weight: 600; font-size: 13.5px; }
.qa-item .qbody { display: none; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 13.5px; }
.qa-item.open .qbody { display: block; }

.icode { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-family: "Cascadia Code", Consolas, monospace; font-size: .93em; }
.callout {
  border-left: 4px solid var(--accent-2);
  background: color-mix(in srgb, var(--accent-2) 14%, var(--panel));
  border-radius: 0 8px 8px 0;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 13.5px;
}

footer.bottomnav {
  border-top: 1px solid var(--border);
  background: var(--panel);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  position: sticky;
  bottom: 0;
  z-index: 20;
}
footer.bottomnav .center-label { font-size: 12.5px; color: var(--text-dim); text-align: center; flex: 1; }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: none; z-index: 25;
}
.overlay.show { display: block; }
@media (max-width: 900px) { .overlay.show { display: block; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menuBtn" aria-label="Abrir menu">☰</button>
    <div class="brand">
      <strong>Python do Zero — Modo Interativo</strong>
      <span>Parte I · Primeiros Passos</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0 / 0 telas</span>
    </div>
  </header>
  <div class="layout">
    <div class="overlay" id="overlay"></div>
    <nav id="sidebar"></nav>
    <main id="content"></main>
  </div>
  <footer class="bottomnav">
    <button class="btn secondary" id="prevBtn">← Anterior</button>
    <span class="center-label" id="footerLabel"></span>
    <button class="btn" id="nextBtn">Próximo →</button>
  </footer>
</div>

<script>
/* =========================================================
   CONTEÚDO — Apostila Python do Zero, Parte I (Cap. 1-3 + Revisão 1)
   ========================================================= */
const MODULES = [
{
  id: 'cap1',
  title: 'Capítulo 1 — O que é programação?',
  screens: [
    { id:'abertura', title:'Abertura', type:'intro', data:{
        objetivos: [
          'O que é um programa de computador.',
          'O que é um algoritmo e por que ele vem antes do código.',
          'O que é uma linguagem de programação.',
          'O que é código-fonte e o que é um interpretador.',
          'O que significam entrada, processamento e saída.',
          'Por que vamos aprender Python especificamente.'
        ],
        antes: 'Não é necessário nenhum conhecimento prévio. Este é o primeiro capítulo da apostila.'
    }},
    { id:'conceito', title:'Conceito', type:'concept', data:{
        paragraphs: [
          'Um computador não "pensa" sozinho. Ele apenas executa instruções, uma atrás da outra, exatamente na ordem em que recebe. Um <b>programa</b> é justamente essa sequência de instruções escritas para que o computador realize uma tarefa.',
          'Antes de escrever qualquer instrução para o computador, uma pessoa programadora pensa primeiro <b>no papel</b> (ou na cabeça) sobre os passos necessários para resolver o problema. Essa sequência de passos, escrita em linguagem natural, chama-se <b>algoritmo</b>.',
          'Um algoritmo pode ser executado por uma pessoa, mas um computador só entende instruções escritas em uma <b>linguagem de programação</b> — um conjunto de palavras, símbolos e regras que o computador (por meio de um programa especial) consegue interpretar e transformar em ações reais, como somar números, exibir um texto na tela ou salvar um arquivo.',
          'O texto que escrevemos usando essa linguagem é chamado de <b>código-fonte</b>. É simplesmente um arquivo de texto, escrito seguindo as regras da linguagem escolhida.',
          'Só que o computador, no fundo, só entende uma linguagem própria dele, feita de números binários (0s e 1s). Ele não lê "Python" diretamente. É necessário um programa especial que leia o código-fonte escrito por nós e traduza (ou execute) essas instruções para o computador. No caso do Python, esse programa especial é chamado de <b>interpretador</b>.'
        ],
        glossary: [
          { term:'algoritmo', def:'uma sequência finita e ordenada de passos para resolver um problema', example:'uma receita de bolo é um algoritmo (misturar ingredientes, colocar na forma, assar por 40 minutos, retirar do forno).' },
          { term:'linguagem de programação', def:'um conjunto de regras e palavras usado para escrever instruções que o computador consegue executar', example:'Python, mas existem centenas de outras, como Java, C e JavaScript.' },
          { term:'código-fonte', def:'o texto do programa, escrito em uma linguagem de programação, antes de ser executado', example:'um arquivo chamado programa.py contendo instruções em Python.' },
          { term:'interpretador', def:'um programa que lê o código-fonte, linha por linha, e manda o computador executar cada instrução', example:'quando você "roda" um arquivo Python, é o interpretador do Python que está fazendo esse trabalho.' }
        ]
    }},
    { id:'visualizando', title:'Visualizando o conceito', type:'diagram', data:{
        intro:'Praticamente todo programa de computador segue o mesmo esquema geral: ele recebe alguma informação, faz algo com essa informação, e devolve um resultado.',
        diagram: 'ENTRADA → PROCESSAMENTO → SAÍDA\n\n- Entrada: a informação que o programa recebe (o que o usuário digita,\n  o conteúdo de um arquivo, um valor já definido no código, etc.).\n- Processamento: o que o programa faz com essa informação (cálculos,\n  comparações, organização de dados).\n- Saída: o resultado que o programa mostra ou produz (um texto na tela,\n  um arquivo salvo, um valor calculado).\n\nExemplo do dia a dia — calculadora de troco em uma loja:\n\nENTRADA\n  valor da compra: R$ 18,50\n  valor pago: R$ 20,00\n        ↓\nPROCESSAMENTO\n  troco = valor pago - valor da compra\n  troco = 20,00 - 18,50\n  troco = 1,50\n        ↓\nSAÍDA\n  "Seu troco é R$ 1,50"',
        note:'Repare que existe uma ordem clara: primeiro recebemos os dados, depois calculamos, só então mostramos o resultado. Todo programa desta apostila seguirá essa mesma lógica.'
    }},
    { id:'exemplo', title:'Primeiro exemplo', type:'example', data:{
        intro:'Ainda não vamos escrever código Python de verdade — isso começa no Capítulo 2. Por enquanto, vamos escrever um algoritmo em linguagem natural, o primeiro passo de qualquer programador antes de programar.',
        problem:'Calcular o troco de uma compra.',
        algoritmo:[
          'Perguntar o valor da compra.',
          'Perguntar o valor pago pelo cliente.',
          'Calcular o troco (valor pago - valor da compra).',
          'Mostrar o troco para o cliente.'
        ],
        code:null,
        codeNote:'Como este é o primeiro capítulo, ainda não há código Python. Observe como o algoritmo acima já está organizado em passos pequenos e numerados — essa é a mesma organização que o código Python terá, capítulo depois de capítulo.'
    }},
    { id:'pordentro', title:'Por dentro do computador', type:'trace', data:{
        intro:'Vamos simular, com valores concretos, os quatro passos do algoritmo. Clique em "Próximo passo" para revelar cada etapa.',
        steps:[
          'Passo 1: perguntar o valor da compra\n   → cliente informa: R$ 18,50',
          'Passo 2: perguntar o valor pago\n   → cliente informa: R$ 20,00',
          'Passo 3: calcular o troco\n   → troco = 20,00 - 18,50\n   → troco = 1,50',
          'Passo 4: mostrar o troco\n   → exibir: "Seu troco é R$ 1,50"'
        ],
        after:'Note que cada passo depende do anterior: só é possível calcular o troco (passo 3) depois de já termos os dois valores (passos 1 e 2). Essa dependência entre passos é a <b>ordem de execução</b> — o computador nunca "adivinha" a ordem, ele segue exatamente a sequência escrita.'
    }},
    { id:'linhaalinha', title:'Explicação linha por linha', type:'lines', data:{
        intro:'Como ainda não há código Python, vamos explicar cada linha do algoritmo — a base do que será convertido em código no próximo capítulo. Clique em cada linha.',
        lines:[
          { code:'1. Perguntar o valor da compra.', explanation:'Esta linha representa uma <b>entrada</b> de dados: o programa precisa obter uma informação de fora (do usuário) antes de continuar.' },
          { code:'2. Perguntar o valor pago pelo cliente.', explanation:'Outra entrada. Note que pedimos os dois valores necessários antes de tentar calcular qualquer coisa — não daria para calcular o troco sem saber ambos.' },
          { code:'3. Calcular o troco (valor pago - valor da compra).', explanation:'Esta linha é o <b>processamento</b>: uma operação matemática (subtração) feita sobre os valores obtidos nos passos anteriores.' },
          { code:'4. Mostrar o troco para o cliente.', explanation:'Esta linha é a <b>saída</b>: o resultado do processamento é entregue para quem está usando o programa.' }
        ]
    }},
    { id:'resultado', title:'Resultado e variação', type:'resultmod', data:{
        resultado:'Seu troco é R$ 1,50',
        modIntro:'Vamos alterar o algoritmo para uma situação ligeiramente diferente: e se o cliente pagar exatamente o valor da compra?',
        modTrace:'1. Perguntar o valor da compra.        → R$ 20,00\n2. Perguntar o valor pago pelo cliente. → R$ 20,00\n3. Calcular o troco.                    → 20,00 - 20,00 = 0,00\n4. Mostrar o troco.                     → "Seu troco é R$ 0,00"',
        modNote:'O algoritmo continua funcionando sem nenhuma alteração na sua estrutura — apenas os valores de entrada mudaram, e o resultado mudou de acordo. Isso é uma característica importante de um bom algoritmo: ele deve funcionar para diferentes valores de entrada, não apenas para um caso específico.',
        naoConfunda:null
    }},

   ESTADO E PERSISTÊNCIA
   ========================================================= */
const STORAGE_KEY = 'apostilaPythonParte1_v1';
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { moduleIndex:0, screenIndex:0, visited:{}, checklist:{}, quizAnswers:{}, notes:{} };
}
let state = loadState();
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

/* =========================================================
   PYODIDE (execução real de Python no navegador)
   ========================================================= */
let pyodideReadyPromise = null;
function ensurePyodide() {
  if (!pyodideReadyPromise) {
    pyodideReadyPromise = (async () => {
      const py = await loadPyodide();
      return py;
    })();
  }
  return pyodideReadyPromise;
}
function formatPythonError(raw) {
  // O Pyodide adiciona vários quadros internos (_pyodide/_base.py) antes do
  // erro real do código do aluno. Aqui mantemos só o que apareceria em um
  // terminal comum: o quadro do próprio código ("<exec>") e a mensagem final.
  const lines = raw.replace(/^PythonError:\s*/,'').split('\n');
  const execIdx = lines.findIndex(l => l.includes('File "<exec>"'));
  if (execIdx === -1) return raw;
  const kept = ['Traceback (most recent call last):', ...lines.slice(execIdx)];
  return kept.join('\n').trim();
}
async function runPythonCode(code, outEl, runBtn) {
  outEl.classList.remove('error');
  outEl.textContent = 'Carregando o interpretador Python (isso só demora na primeira vez)...';
  if (runBtn) runBtn.disabled = true;
  try {
    const pyodide = await ensurePyodide();
    outEl.textContent = 'Executando...';
    let out = [];
    pyodide.setStdout({ batched:(s)=> out.push(s) });
    pyodide.setStderr({ batched:(s)=> out.push(s) });
    await pyodide.runPythonAsync(code);
    outEl.textContent = out.length ? out.join('\n') : '(nenhuma saída — programa executou sem usar print())';
  } catch (err) {
    outEl.classList.add('error');
    outEl.textContent = formatPythonError(String(err));
  } finally {
    if (runBtn) runBtn.disabled = false;
  }
}

/* =========================================================
   HELPERS DE RENDER
   ========================================================= */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function codeRunnerHTML(starterCode, id) {
  return '<div class="code-runner" id="'+id+'">' +
    '<textarea spellcheck="false">'+esc(starterCode||'')+'</textarea>' +
    '<div class="runner-bar">' +
      '<button class="btn small run">▶ Executar</button>' +
      '<button class="btn secondary small clear">Limpar saída</button>' +
      '<span class="pyodide-note">Python real, rodando no seu navegador (Pyodide)</span>' +
    '</div>' +
    '<pre class="runner-out"></pre>' +
  '</div>';
}
function wireCodeRunner(container) {
  container.querySelectorAll('.code-runner').forEach(box => {
    const ta = box.querySelector('textarea');
    const out = box.querySelector('.runner-out');
    const runBtn = box.querySelector('.run');
    const clearBtn = box.querySelector('.clear');
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0,s) + '    ' + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s+4;
      }
    });
    runBtn.addEventListener('click', () => runPythonCode(ta.value, out, runBtn));
    clearBtn.addEventListener('click', () => { out.textContent=''; out.classList.remove('error'); });
  });
}

function renderScreen(mod, screen) {
  const c = document.getElementById('content');
  c.innerHTML = '';
  const kicker = el('div','screen-kicker', esc(mod.title));
  const title = el('h1','screen-title', esc(screen.title));
  c.appendChild(kicker);
  c.appendChild(title);

  const body = el('div');
  c.appendChild(body);

  const renderers = {
    intro: renderIntro, concept: renderConcept, diagram: renderDiagram,
    example: renderExample, trace: renderTrace, lines: renderLines,
    resultmod: renderResultMod, errors: renderErrors, guided: renderGuided,
    exercises: renderExercises, summary: renderSummary, checklist: renderChecklist,
    quiz: renderQuiz, refs: renderRefs, table: renderTable, list: renderList, qa: renderQa
  };
  (renderers[screen.type] || function(){})(body, mod, screen);
  wireCodeRunner(body);
}

}

function renderTrace(body, mod, screen) {
  const d = screen.data;

  card.appendChild(el('p','', esc(d.intro)));

  d.steps.forEach(s => list.appendChild(el('li','', esc(s))));
  card.appendChild(list);
  const row = el('div','btn-row');
  const nextBtn = el('button','btn small', 'Próximo passo →');
  const resetBtn = el('button','btn secondary small', 'Reiniciar');
  row.appendChild(nextBtn); row.appendChild(resetBtn);
  card.appendChild(row);
  const afterP = d.after ? el('p','', d.after) : null;
  if (afterP) { afterP.style.display='none'; card.appendChild(afterP); }

  let shown = 0;
  const items = list.querySelectorAll('li');
  function update() {
    items.forEach((it,i) => it.classList.toggle('shown', i < shown));
    nextBtn.disabled = shown >= items.length;
    if (afterP) afterP.style.display = shown >= items.length ? 'block' : 'none';
  }
  nextBtn.addEventListener('click', () => { if (shown < items.length) shown++; update(); });
  resetBtn.addEventListener('click', () => { shown = 0; update(); });
  update();
  body.appendChild(card);
}

function renderChecklist(body, mod, screen) {
  const d = screen.data;
  const card = el('div','card');
  card.appendChild(el('h3','', '✔ Checklist'));
  const progressLbl = el('div','checklist-progress','');
  card.appendChild(progressLbl);
  const items = [];
  d.items.forEach((text, idx) => {
    const key = mod.id+'_chk_'+idx;
    const row = el('div','checklist-item');
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.id='cb_'+key;
    cb.checked = !!state.checklist[key];
    const label = document.createElement('label');
    label.htmlFor = 'cb_'+key;
    label.textContent = text;
    row.appendChild(cb); row.appendChild(label);
    if (cb.checked) row.classList.add('done');
    cb.addEventListener('change', () => {
      state.checklist[key] = cb.checked;
      row.classList.toggle('done', cb.checked);
      saveState();
      updateProgress();
    });
    card.appendChild(row);
    items.push(key);
  });
  function updateProgress() {
    const done = items.filter(k => state.checklist[k]).length;
    progressLbl.textContent = done + ' de ' + items.length + ' itens concluídos';
  }
  updateProgress();
  body.appendChild(card);
  if (d.finalNote) {
    const note = el('div','callout', '🎓 ' + esc(d.finalNote));
    body.appendChild(note);
  }
}

function renderQuiz(body, mod, screen) {
  const d = screen.data;
  const card = el('div','card');
  card.appendChild(el('h3','', '❓ Miniquiz'));
  const scoreLbl = el('div','quiz-score','');
  card.appendChild(scoreLbl);
  body.appendChild(card);

  const answered = state.quizAnswers[mod.id+'_'+screen.id] || {};
  function updateScore() {
    let total = d.questions.length, done = 0, correct = 0;
    d.questions.forEach((q,i) => { if (answered[i] !== undefined) { done++; if (answered[i]===q.correct) correct++; } });
    scoreLbl.textContent = 'Pontuação: '+correct+' / '+total+' ('+done+' de '+total+' respondidas)';
  }

  d.questions.forEach((q, qi) => {
    const box = el('div','quiz-q');
    box.appendChild(el('div','qtext', (qi+1)+'. '+esc(q.q)));
    const explain = el('div','quiz-explain', '💬 '+esc(q.explanation));
    const optButtons = [];
    q.options.forEach((opt, oi) => {
      const b = el('button','quiz-opt', esc(opt));
      b.addEventListener('click', () => {
        if (answered[qi] !== undefined) return;
        answered[qi] = oi;
        state.quizAnswers[mod.id+'_'+screen.id] = answered;
        saveState();
        applyState();
        updateScore();
      });
      box.appendChild(b);
      optButtons.push(b);
    });
    box.appendChild(explain);
    function applyState() {
      if (answered[qi] === undefined) return;
      optButtons.forEach((b,oi) => {
        b.disabled = true;
        if (oi === q.correct) b.classList.add('correct');
        else if (oi === answered[qi]) b.classList.add('wrong');
      });
      explain.classList.add('open');
    }
    applyState();
    body.appendChild(box);
  });
  updateScore();
}

/* =========================================================
   NAVEGAÇÃO / SIDEBAR / PROGRESSO
   ========================================================= */
function totalScreens() { return MODULES.reduce((n,m)=>n+m.screens.length,0); }
function visitedCount() { return Object.keys(state.visited).length; }

function buildSidebar() {
  const nav = document.getElementById('sidebar');
  nav.innerHTML = '';
  MODULES.forEach((mod, mi) => {
    const wrap = el('div','mod');
    const h = el('div','mod-title', esc(mod.title)+'<span>▾</span>');
    const ul = el('ul','mod-screens');
    mod.screens.forEach((scr, si) => {
      const key = mi+'-'+si;
      const li = el('li','', '<span class="chk">'+(state.visited[key] ? '✓' : '')+'</span><span>'+esc(scr.title)+'</span>');
      li.dataset.mi = mi; li.dataset.si = si;
      li.addEventListener('click', () => goTo(mi, si));
      ul.appendChild(li);
    });
    h.addEventListener('click', () => { ul.style.display = ul.style.display==='none' ? '' : 'none'; });
    wrap.appendChild(h); wrap.appendChild(ul);
    nav.appendChild(wrap);
  });
}

function updateSidebarActive() {
  document.querySelectorAll('#sidebar li').forEach(li => {
    const mi = +li.dataset.mi, si = +li.dataset.si;
    li.classList.toggle('active', mi===state.moduleIndex && si===state.screenIndex);
    const key = mi+'-'+si;
    li.querySelector('.chk').textContent = state.visited[key] ? '✓' : '';
  });
}

function updateProgressBar() {
  const total = totalScreens(), done = visitedCount();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = done+' / '+total+' telas';
}

function updateFooter() {
  const mod = MODULES[state.moduleIndex];
  const screen = mod.screens[state.screenIndex];
  const globalIdx = MODULES.slice(0,state.moduleIndex).reduce((n,m)=>n+m.screens.length,0) + state.screenIndex + 1;
  document.getElementById('footerLabel').textContent = 'Tela '+globalIdx+' de '+totalScreens()+' · '+mod.title+' → '+screen.title;
  document.getElementById('prevBtn').disabled = (state.moduleIndex===0 && state.screenIndex===0);
  const isLast = (state.moduleIndex===MODULES.length-1 && state.screenIndex===mod.screens.length-1);
  document.getElementById('nextBtn').disabled = isLast;
  document.getElementById('nextBtn').textContent = isLast ? 'Fim da Parte I ✓' : 'Próximo →';
}

function goTo(mi, si) {
  state.moduleIndex = mi;
  state.screenIndex = si;
  state.visited[mi+'-'+si] = true;
  saveState();
  render();
  document.getElementById('content').scrollTop = 0;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function render() {
  const mod = MODULES[state.moduleIndex];
  const screen = mod.screens[state.screenIndex];
  renderScreen(mod, screen);
  updateSidebarActive();
  updateProgressBar();
  updateFooter();
}

document.getElementById('prevBtn').addEventListener('click', () => {
  let mi = state.moduleIndex, si = state.screenIndex;
  if (si > 0) si--;
  else if (mi > 0) { mi--; si = MODULES[mi].screens.length-1; }
  goTo(mi, si);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  let mi = state.moduleIndex, si = state.screenIndex;
  const mod = MODULES[mi];
  if (si < mod.screens.length-1) si++;
  else if (mi < MODULES.length-1) { mi++; si = 0; }
  goTo(mi, si);
});
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
});
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
});

/* boot */
buildSidebar();
state.visited[state.moduleIndex+'-'+state.screenIndex] = true;
render();
</script>
